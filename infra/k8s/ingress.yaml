# Baseline section 20 - Ingress with TLS. host/secretName are placeholders; wire up cert-manager
# (or your CA of choice) to populate idtrust-tls before applying this in a real cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: idtrust-backend
  namespace: idtrust
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - api.idtrust.example
      secretName: idtrust-tls
  rules:
    - host: api.idtrust.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: idtrust-backend
                port:
                  number: 8080
