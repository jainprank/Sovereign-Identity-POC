name: idtrust

services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-idtrust}
      POSTGRES_USER: ${DATABASE_USERNAME:-idtrust}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-idtrust}
    ports:
      - "5432:5432"
    volumes:
      - idtrust_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-idtrust} -d ${DATABASE_NAME:-idtrust}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "8081:8080"

volumes:
  idtrust_postgres_data:
