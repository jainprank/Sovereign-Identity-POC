name: idtrust

services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-idtrust}
      POSTGRES_USER: ${DATABASE_USERNAME:-idtrust}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-idtrust}
    ports:
      - "5432:5432"
    volumes:
      - idtrust_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-idtrust} -d ${DATABASE_NAME:-idtrust}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "8081:8080"

  # E15 - optional: builds and runs the backend itself from ../backend/Dockerfile, so the full
  # stack can start with one `docker compose up` instead of `./gradlew :app:bootRun` separately.
  # Service-to-service URLs below use the other services' Compose network names (not localhost),
  # matching infra/k8s/configmap.yaml's equivalent in-cluster values exactly.
  app:
    build:
      context: ../backend
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME:-idtrust}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-idtrust}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-idtrust}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-idtrust}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-idtrust-app}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      KMS_PROVIDER: ${KMS_PROVIDER:-internal}
      KMS_MASTER_KEY_BASE64: ${KMS_MASTER_KEY_BASE64:-}
      HEDERA_ENABLED: ${HEDERA_ENABLED:-false}
      HEDERA_NETWORK: ${HEDERA_NETWORK:-testnet}
      HEDERA_ACCOUNT_ID: ${HEDERA_ACCOUNT_ID:-}
      HEDERA_OPERATOR_KEY: ${HEDERA_OPERATOR_KEY:-}
      HEDERA_TOPIC_ID: ${HEDERA_TOPIC_ID:-}
    ports:
      - "8080:8080"

volumes:
  idtrust_postgres_data:
