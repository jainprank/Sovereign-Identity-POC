dependencies {
    api 'org.springframework:spring-web'
    api 'org.springframework:spring-webmvc'
    api 'org.springframework.boot:spring-boot-starter-validation'
    api 'jakarta.servlet:jakarta.servlet-api:6.0.0'
    // EPIC 18 (FR-ANL-*, Analytics & Monitoring) - MeterRegistry is exposed as `api` (not
    // `implementation`) so every module depending on `common` can inject it directly to record a
    // Micrometer counter/timer at its own choke points, without each module needing its own
    // explicit micrometer-core dependency. The concrete registry implementation
    // (`micrometer-registry-prometheus`) is wired once, at the `app` composition root.
    api 'io.micrometer:micrometer-core'
    api 'org.springframework.data:spring-data-commons'
    implementation 'org.slf4j:slf4j-api'
    // GlobalExceptionHandler.handleAccessDenied - every module already carries spring-security-core
    // transitively via the identity module's actual security wiring; declaring it directly here
    // too is needed so this shared @RestControllerAdvice can translate @PreAuthorize's
    // AuthorizationDeniedException (a subtype of AccessDeniedException) into a 403 instead of
    // letting it fall through to the catch-all 500 handler.
    implementation 'org.springframework.security:spring-security-core'
}
