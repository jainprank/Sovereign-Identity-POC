dependencies {
    implementation project(':common')
    implementation project(':did')
    implementation project(':credential')
    // Explicit rather than relying on transitivity (did/build.gradle's precedent): WalletService
    // and WalletPresentationSigner call com.idtrust.kms.key.KeyService/ManagedKey directly for
    // FR-WAL-012 (Generate Presentation), just like credential/build.gradle does for issuance.
    implementation project(':kms')
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // Oid4vciOfferGenerator serializes the offer payload with Jackson's ObjectMapper, matching
    // credential's CredentialOfferGenerator.
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    // FR-OID4VCI-004 (QR Offer): reuses the same ZXing dependency introduced for FR-ISS-010 in E07.
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.google.zxing:javase:3.5.3'
}
