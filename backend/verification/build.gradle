dependencies {
    implementation project(':common')
    implementation project(':did')
    implementation project(':credential')
    implementation project(':trust')
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // Oid4vpRequestGenerator serializes the request payload with Jackson's ObjectMapper, matching
    // wallet's Oid4vciOfferGenerator.
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    // FR-VER-002 (QR Verification Request): reuses the same ZXing dependency introduced for
    // FR-ISS-010 in E07 and FR-OID4VCI-004 in E09.
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.google.zxing:javase:3.5.3'
}
