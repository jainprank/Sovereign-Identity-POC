dependencies {
    implementation project(':common')
    implementation project(':did')
    implementation project(':kms')
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // Explicit rather than relying on transitivity: JwtVerifiableCredentialSigner and
    // CredentialOfferGenerator serialize JWT segments/offer payloads with Jackson's ObjectMapper.
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    // FR-ISS-010 (Generate QR): no QR encoding capability exists anywhere else in the codebase, and
    // hand-rolling QR matrix generation (Reed-Solomon error correction, etc.) is out of scope.
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.google.zxing:javase:3.5.3'
}
