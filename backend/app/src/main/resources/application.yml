spring:
  application:
    name: idtrust

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/idtrust}
    username: ${DATABASE_USERNAME:idtrust}
    password: ${DATABASE_PASSWORD:idtrust}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8081}/realms/${KEYCLOAK_REALM:idtrust}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        # FR-ANL-006 (System Health) via health; FR-ANL-001 through 005/007 (Micrometer counters/
        # timers added across E15) via prometheus/metrics - see the root README's E15 section.
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true

logging:
  pattern:
    level: "%5p [%X{correlationId}]"

# Placeholder for identity-layer configuration introduced in a later epic. Kept here (commented)
# so the full external configuration surface is visible from E01 onward - see the Architecture &
# Implementation Baseline, section 19 ("Docker Compose Baseline").
#
# idtrust:
#   keycloak:
#     url: ${KEYCLOAK_URL:}
#     realm: ${KEYCLOAK_REALM:idtrust}
#     client-id: ${KEYCLOAK_CLIENT_ID:idtrust-app}
#     client-secret: ${KEYCLOAK_CLIENT_SECRET:}

idtrust:
  security:
    cors:
      # E15 - the frontend/ scaffold's Vite dev server origin. CORS_ALLOWED_ORIGINS is a
      # comma-separated list; override with the real deployed frontend origin(s) in every
      # non-local environment (see identity.security.SecurityCorsProperties' Javadoc).
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  kms:
    provider: ${KMS_PROVIDER:internal}
    # INSECURE all-zero default for local development ONLY (backend.kms.crypto.KeyEncryptionService's
    # AES-256 key-encryption-key). Every non-local environment MUST override this via
    # KMS_MASTER_KEY_BASE64 with a securely generated 32-byte key, e.g.:
    #   openssl rand -base64 32
    master-key-base64: ${KMS_MASTER_KEY_BASE64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
  hedera:
    # Disabled by default so identity/credential functionality remains fully operational without a
    # real Hedera account (see the hedera module's package-info.java and HederaProperties' Javadoc).
    # Every environment that wants real anchoring must override this via HEDERA_ENABLED=true and
    # supply real account-id/operator-key/topic-id values.
    enabled: ${HEDERA_ENABLED:false}
    network: ${HEDERA_NETWORK:testnet}
    account-id: ${HEDERA_ACCOUNT_ID:}
    operator-key: ${HEDERA_OPERATOR_KEY:}
    topic-id: ${HEDERA_TOPIC_ID:}
  apiplatform:
    # FR-API-004 (Rate Limit) - in-memory, per-caller, fixed-window budget; see
    # apiplatform.ratelimit.RateLimitFilter and ApiPlatformProperties' Javadoc for why this is not
    # distributed.
    rate-limit-requests-per-minute: ${API_RATE_LIMIT_REQUESTS_PER_MINUTE:120}
    # FR-API-002 (OAuth Client) - client_credentials access token lifetime.
    oauth-access-token-ttl-seconds: ${API_OAUTH_ACCESS_TOKEN_TTL_SECONDS:3600}
  notification:
    email:
      # FR-NOT-001 (Email Notification) - disabled by default so this platform is fully
      # operational without a real SMTP account; see notification.config.NotificationProperties'
      # Javadoc, mirrors idtrust.hedera.enabled's precedent exactly.
      enabled: ${NOTIFICATION_EMAIL_ENABLED:false}
      host: ${NOTIFICATION_EMAIL_HOST:}
      port: ${NOTIFICATION_EMAIL_PORT:587}
      username: ${NOTIFICATION_EMAIL_USERNAME:}
      password: ${NOTIFICATION_EMAIL_PASSWORD:}
      from: ${NOTIFICATION_EMAIL_FROM:no-reply@idtrust.example}
