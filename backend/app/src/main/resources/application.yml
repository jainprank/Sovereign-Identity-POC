spring:
  application:
    name: idtrust

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/idtrust}
    username: ${DATABASE_USERNAME:idtrust}
    password: ${DATABASE_PASSWORD:idtrust}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true

logging:
  pattern:
    level: "%5p [%X{correlationId}]"

