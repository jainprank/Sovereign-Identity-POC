dependencies {
    implementation project(':common')
    // NotificationEventPublisherImpl resolves "who to notify" against the tenant's own user
    // directory (identity.user.UserRepository) - mirrors apiplatform depending on kms for its own
    // single cross-module need (envelope encryption) rather than duplicating the query here.
    implementation project(':identity')
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
}
